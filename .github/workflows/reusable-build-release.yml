# Pipeline steps S36 to S44: the release is tagged, the artifact is built ONCE from that commit, and it is
# published as an immutable GitHub release whose assets are the zip and its SHA-256 checksum.
#
# A reusable workflow. Nothing in this repository triggers it; a product repository calls it from its own
# .github/workflows/build-release.yml, started by workflow_dispatch, pinned to a version tag of this
# repository. The dispatch comes from Switchyard at a leader's request, so a release here means "requested
# for deployment", never "merged". The tag is <date>.<run number> of the CALLING workflow, so the run
# counter is the patch number (Matt, 2026-10-25). The public contract is docs/reusable-build-release.md.

name: Reusable build release

on:
  workflow_call:
    inputs:
      project-path:
        description: Path to the deployable project file, relative to the repository root. Passed to dotnet publish as one argument, so a path with spaces needs no extra quoting.
        type: string
        required: true
      artifact-name:
        description: The asset file stem. The zip is <artifact-name>-<tag>.zip and the checksum file is that name plus .sha256.
        type: string
        required: true
      time-zone:
        description: IANA time zone the date part of the tag is taken in, so the tag carries the calendar date of the people who read it.
        type: string
        default: UTC
      dotnet-version:
        description: The .NET SDK version to install, in any form actions/setup-dotnet accepts.
        type: string
        default: 10.0.x
      configuration:
        description: The build configuration passed to dotnet publish.
        type: string
        default: Release
      runs-on:
        description: The runner label. A caller whose code needs Windows passes windows-latest.
        type: string
        default: ubuntu-latest
      stamp-version:
        description: When true, the tag is written into the assemblies as InformationalVersion so a running site can report which release it is.
        type: boolean
        default: true
    outputs:
      tag:
        description: The tag the release was created under, <YYYY.MMdd>.<run number>.
        value: ${{ jobs.build-and-release.outputs.tag }}
      digest:
        description: The SHA-256 of the zip asset, as hex.
        value: ${{ jobs.build-and-release.outputs.digest }}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-reusable-build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.package.outputs.digest }}
    env:
      PROJECT_PATH: ${{ inputs.project-path }}
      ARTIFACT_NAME: ${{ inputs.artifact-name }}
      TIME_ZONE: ${{ inputs.time-zone }}
      CONFIGURATION: ${{ inputs.configuration }}
      STAMP_VERSION: ${{ inputs.stamp-version }}
      PUBLISH_DIRECTORY: publish
      RUN_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Name the release
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "This workflow creates the tag itself and was started from tag $GITHUB_REF_NAME. Start it by workflow_dispatch on a branch." >&2
            exit 1
          fi
          tag="$(TZ="$TIME_ZONE" date +%Y.%m%d).$RUN_NUMBER"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release $tag from $GITHUB_REF_NAME at $GITHUB_SHA (run $GITHUB_RUN_ID, number $RUN_NUMBER)"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET ${{ inputs.dotnet-version }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        id: restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Publish
        id: publish
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          arguments=(--no-restore --configuration "$CONFIGURATION" --output "$PUBLISH_DIRECTORY" --self-contained false)
          if [ "$STAMP_VERSION" = "true" ]; then
            arguments+=("-p:InformationalVersion=$TAG")
          fi
          dotnet publish "$PROJECT_PATH" "${arguments[@]}"

      - name: Package
        id: package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          zip_name="$ARTIFACT_NAME-$TAG.zip"
          (cd "$PUBLISH_DIRECTORY" && zip -q -r -X "../$zip_name" .)
          sha256sum "$zip_name" > "$zip_name.sha256"
          digest="$(cut -d ' ' -f 1 "$zip_name.sha256")"
          echo "zip-name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Packaged $zip_name ($(stat -c %s "$zip_name") bytes), sha256 $digest"

      - name: Publish the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP_NAME: ${{ steps.package.outputs.zip-name }}
          DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          notes="Built once from $GITHUB_REF_NAME at commit $GITHUB_SHA by the shared build-release workflow."
          notes="$notes"$'\n'"Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (run id $GITHUB_RUN_ID, number $RUN_NUMBER)"
          notes="$notes"$'\n'"Asset sha256: $DIGEST"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "$TAG" --notes "$notes"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$ZIP_NAME" "$ZIP_NAME.sha256"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)" >> "$GITHUB_OUTPUT"

      - name: Write summary
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          DIGEST: ${{ steps.package.outputs.digest }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          echo "Build release \`${TAG:-unnamed}\` for \`$PROJECT_PATH\`: restore ${RESTORE_OUTCOME:-skipped}, publish ${PUBLISH_OUTCOME:-skipped}, package ${PACKAGE_OUTCOME:-skipped}, release ${RELEASE_OUTCOME:-skipped}." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DIGEST" ]; then echo "Asset sha256: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$RELEASE_URL" ]; then echo "Release: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"; fi
